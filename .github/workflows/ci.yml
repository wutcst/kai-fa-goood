name: CI - Build & Check

on:
  push:
    branches: [master, lzh]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  format-check:
    name: Code Format Check (clang-format)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        shell: bash
        run: bash scripts/clang-format-check.sh

  build-test-release:
    name: Build, Test & Release JAR
    needs: format-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Maven verify and package release JAR
        shell: bash
        run: mvn -B -DskipFormatCheck=true verify package

      - name: Verify release JAR
        shell: bash
        run: |
          JAR="target/fire-ice-1.0.0-release.jar"
          test -f "$JAR"
          java -jar "$JAR" --version
          ls -lh "$JAR"

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: fire-ice-release-jar
          path: target/fire-ice-1.0.0-release.jar
          retention-days: 30

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: fire-ice-native-bin
          path: |
            fire-ice/build/fireice_server.exe
            fire-ice/build/fireice_client.exe
            fire-ice/build/*.dll
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-test-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fire-ice-release-jar
          path: dist/

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-alpha.${{ github.run_number }}
          name: Fire-Ice Online v0.3.0-alpha.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: dist/fire-ice-1.0.0-release.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
