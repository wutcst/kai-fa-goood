name: CI - Build & Check

on:
  push:
    branches: [master, lzh]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  format-check:
    name: Code Format Check (clang-format)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        shell: bash
        run: bash scripts/clang-format-check.sh

  build-test-release:
    name: Build, Test & Package
    needs: format-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=target/fire-ice-${VERSION}-release.jar" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Maven verify and package release JAR
        shell: bash
        run: mvn -B -DskipFormatCheck=true verify package

      - name: Verify release JAR
        shell: bash
        run: |
          JAR="${{ steps.meta.outputs.jar }}"
          test -f "$JAR"
          java -jar "$JAR" --version
          ls -lh "$JAR"

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: fire-ice-release-jar
          path: ${{ steps.meta.outputs.jar }}
          retention-days: 30

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: fire-ice-native-bin
          path: |
            build/fireice_server.exe
            build/fireice_client.exe
            build/*.dll
          retention-days: 7
