name: CI - Build & Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  format-check:
    name: Code Format Check (clang-format)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        shell: bash
        run: |
          echo "Checking C++ source formatting (warnings only)..."
          SOURCES=$(find fire-ice/src -name '*.cpp' -o -name '*.hpp' | sort)
          WARNINGS=0
          for f in $SOURCES; do
            clang-format --dry-run "$f" 2>&1 || {
              echo "::warning file=$f::Formatting differs. Run: clang-format -i $f"
              WARNINGS=1
            }
          done
          if [ "$WARNINGS" -eq 1 ]; then
            echo "::warning::Some files have formatting differences (non-blocking)."
          else
            echo "All source files passed format check."
          fi

  build:
    name: Build (MSVC x64 Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        shell: bash
        run: |
          cd fire-ice
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cd fire-ice
          cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp fire-ice/build/fireice_server.exe artifacts/ 2>/dev/null || true
          cp fire-ice/build/fireice_client.exe artifacts/ 2>/dev/null || true
          cp fire-ice/build/*.dll artifacts/ 2>/dev/null || true
          mkdir -p artifacts/levels
          cp -r fire-ice/assets/levels/* artifacts/levels/ 2>/dev/null || true
          mkdir -p artifacts/textures
          cp -r fire-ice/assets/textures/* artifacts/textures/ 2>/dev/null || true
          echo "Artifacts collected:"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fireice-release
          path: artifacts/
          retention-days: 7

  test:
    name: Smoke Test
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fireice-release
          path: test-bin/

      - name: Verify server starts
        shell: bash
        run: |
          cd test-bin
          echo "Starting server for smoke test..."
          timeout 5 ./fireice_server.exe 2>&1 || true
          echo "Server smoke test finished."
